<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #171717;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px"
    >
      <tr>
        <td style="padding: 32px">
          <h1 style="margin: 0 0 16px; font-size: 20px">Redefinição de senha</h1>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5">
            Recebemos um pedido para criar uma nova senha. Clique no botão abaixo para continuar.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
              style="
                display: inline-block;
                background: #171717;
                color: #ffffff;
                text-decoration: none;
                padding: 12px 20px;
                border-radius: 8px;
                font-size: 15px;
              "
            >
              Criar nova senha
            </a>
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #737373">
            Se você não pediu a redefinição, ignore este e-mail. Sua senha continua a mesma.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
